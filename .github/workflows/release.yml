name: Release

# A pushed tag vX.Y.Z (or vX.Y.Z-beta.N) builds, packs (Velopack) and publishes a GitHub release. The installed apps
# update from it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check version, extract release notes
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')          # Velopack versions have no "v"
          $props = [xml](Get-Content Directory.Build.props)
          $declared = "$($props.Project.PropertyGroup.Version)".Trim()
          if ($declared -ne $v) { throw "Tag v$v does not match <Version> $declared in Directory.Build.props" }
          $text = Get-Content docs/CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## v$([regex]::Escape($v))\s*\r?\n(.*?)(?=^## v|\z)")
          if (-not $m.Success) { throw "docs/CHANGELOG.md has no section '## v$v'" }
          Set-Content release-notes.md $m.Groups[1].Value.Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          # Versions like 1.0.0-beta.1 are published as pre-releases (not offered as "latest").
          "pre=$(if ($v.Contains('-')) { '--pre' })" >> $env:GITHUB_OUTPUT

      - run: dotnet test --solution Frametide.slnx -c Release

      - run: dotnet publish src/Frametide/Frametide.csproj -c Release -r win-x64 --self-contained -o publish

      # Same version as the Velopack package the app uses.
      - run: dotnet tool install -g vpk --version 1.2.161

      # Previous release for delta updates; there is none before the first release.
      - run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} ${{ steps.ver.outputs.pre }}
        continue-on-error: true

      # Installed for all users (C:\Program Files\Frametide): Frametide runs elevated and starts itself elevated at
      # sign-in, so its files must only be changeable by administrators. Updates ask for UAC (Velopack elevates).
      - run: >
          vpk pack --packId Frametide --packVersion ${{ steps.ver.outputs.version }} --packDir publish
          --mainExe Frametide.exe --packTitle Frametide --icon src/Frametide/Assets/frametide.ico --releaseNotes release-notes.md
          --msi --instLocation PerMachine --noPortable

      # Uploaded as a draft first: Velopack always builds Setup.exe as well, which installs per user (user-writable
      # folder). Only the MSI is offered for download.
      - run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} ${{ steps.ver.outputs.pre }}
          --releaseName "Frametide v${{ steps.ver.outputs.version }}" --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Publish with the MSI only
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset ${{ github.ref_name }} Frametide-win-Setup.exe --yes
          gh release edit ${{ github.ref_name }} --draft=false
